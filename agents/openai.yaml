interface:
  display_name: "GOWA WhatsApp"
  short_description: "Read, send, and verify WhatsApp activity with direct GOWA API calls"
  default_prompt: "Use $gowa-whatsapp-skill and its embedded managed configuration. Call /devices, verify the target account, scope every chat/send request, paginate fully, construct JSON with jq, and read back exact native message IDs. Reconcile uncertain sends before retrying. Inspect deployed version for media, webhooks, and self-hosted routes. For Twenty, preserve the live integration and source-ID granularity; use chat-level archival only when requested."
