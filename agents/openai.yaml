interface:
  display_name: "GOWA WhatsApp"
  short_description: "Read, transcribe, send, and verify WhatsApp activity with direct GOWA API calls"
  default_prompt: "Use $gowa-whatsapp-skill and its embedded managed configuration. If the skill is missing from the catalog, use the bash setup in SKILL.md. Call /devices, verify the target account, scope every chat/send request, paginate fully, construct JSON with jq, and read back exact native message IDs. Use normal /chat history by default; when transcripts are requested, use the direct same-domain /transcribe routes that enrich audio rows without changing stock GOWA. If curl cannot resolve the CORS proxy, run the same commands on the Mac via Desktop Commander; never retry a failing sandbox and never use WhatsApp Go MCP. Reconcile uncertain sends before retrying. Inspect deployed version for media, webhooks, and self-hosted routes. For Twenty, preserve the live integration and source-ID granularity; use chat-level archival only when requested."
